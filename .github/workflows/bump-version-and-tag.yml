name: Bump version and tag on main

on:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: bump-version-and-tag
  cancel-in-progress: false

jobs:
  bump:
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip version bump]')"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Bump patch version in package.json
        id: bump
        run: |
          FILE="hiking_map_frontend_next/package.json"
          CURRENT_VERSION="$(node -p "require('./${FILE}').version")"

          IFS='.' read -r MAJOR MINOR PATCH <<< "${CURRENT_VERSION}"
          NEW_VERSION="${MAJOR}.${MINOR}.$((PATCH + 1))"

          node -e "
            const fs = require('fs');
            const path = '${FILE}';
            const pkg = JSON.parse(fs.readFileSync(path, 'utf8'));
            pkg.version = '${NEW_VERSION}';
            fs.writeFileSync(path, JSON.stringify(pkg, null, 2) + '\n');
          "

          echo "new_version=${NEW_VERSION}" >> "${GITHUB_OUTPUT}"

      - name: Commit and tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add hiking_map_frontend_next/package.json
          git commit -m "chore: bump version to v${{ steps.bump.outputs.new_version }} [skip version bump]"
          git tag "v${{ steps.bump.outputs.new_version }}"

          git push origin HEAD:main
          git push origin "v${{ steps.bump.outputs.new_version }}"
